<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Porchlight: a home for every follower</title>
    <meta name="description" content="A tiny 3D town where every follower gets a house." />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="vignette"></div>
    <div id="labels"></div>

    <header class="hud top">
      <div class="brand">
        <strong id="town-name">Porchlight</strong>
        <span id="count">Loading the town…</span>
      </div>
      <div class="chips">
        <span class="chip" id="clock">--:--</span>
        <span class="chip" id="coins">🪙 0</span>
        <span class="chip" id="energy">⚡ 100</span>
        <span class="chip" id="stay" hidden title="Stay 15 active minutes a day to earn a house point">⏳ 0/15</span>
      </div>
      <form id="search" class="search" autocomplete="off">
        <span>@</span>
        <input id="search-input" placeholder="find a house" aria-label="Instagram username" maxlength="31" />
        <button type="submit">Find</button>
      </form>
    </header>

    <div id="demo-badge" class="badge" hidden>Demo mode · fake residents · progress saved in this browser</div>

    <div id="nav" class="navbar" hidden>
      <div class="nav-main"><b class="nav-text"></b><small class="nav-sub"></small></div>
      <button class="nav-auto" title="Walk me there">▶</button>
      <button class="nav-stop" title="Stop directions">✕</button>
    </div>

    <!-- Touch / quick controls: joystick on the left, buttons on the right -->
    <div id="controls"></div>
    <div id="side" class="side">
      <button class="round" id="places-btn" title="Places"><span>📍</span><small>Places</small></button>
      <button class="round" id="react-btn" title="React"><span>😊</span><small>React</small></button>
      <button class="round" id="run-btn" title="Run"><span>🏃</span><small>Run</small></button>
      <button class="round" id="cam-btn" title="Camera"><span>🎥</span><small>View</small></button>
    </div>
    <div id="react-menu" class="react-menu" hidden></div>

    <div id="prompt" class="prompt" hidden></div>
    <div id="celebrate" class="celebrate" hidden></div>

    <footer class="hud bottom">
      <p class="hint" id="hint">Tap trees, rocks, flowers and the pond · WASD or tap to walk · drag to turn · <span id="online">0</span> nearby</p>
      <nav class="hotbar">
        <button class="slot" id="bag-btn"><span>🎒</span><small>Bag</small></button>
        <button class="slot" id="quests-btn"><span>📜</span><small>Quests</small></button>
        <button class="slot" id="plaza-btn"><span>⛲</span><small>Plaza</small></button>
        <button class="slot" id="home-btn" hidden><span>🏠</span><small>Home</small></button>
        <button class="slot" id="friends-btn"><span>👥</span><small>Friends</small><i id="friends-badge" class="badge-dot" hidden></i></button>
        <button class="slot" id="drive-btn" hidden><span>🚗</span><small>Drive</small></button>
        <button class="slot primary" id="key-btn"><span>🔑</span><small>Sign in</small></button>
        <button class="slot" id="settings-btn"><span>⚙️</span><small>Menu</small></button>
      </nav>
    </footer>

    <!-- Sheets (bottom panels) -->
    <section id="sheet" class="sheet" hidden>
      <header><h2 id="sheet-title"></h2><button class="close" aria-label="Close">✕</button></header>
      <div id="sheet-body"></div>
    </section>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
